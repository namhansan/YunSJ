backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "기본 정보"
    files:
      - name: "settings"
        label: "기본 정보 수정"
        file: "content/site.json"
        fields:
          - { label: "이름 (한글)", name: "name_kr", widget: "string" }
          - { label: "이름 (한자, 선택)", name: "name_hanja", widget: "string", required: false }
          - { label: "이름 (영문, 선택)", name: "name_en", widget: "string", required: false }
          - { label: "닉네임 (예: 몽감독)", name: "nickname", widget: "string", required: false }
          - { label: "메인 문구 (홈 화면 큰 제목)", name: "tagline", widget: "string" }
          - { label: "소개 요약 (홈 화면, 2~3줄 권장)", name: "intro", widget: "text" }
          - { label: "프로필 사진 (홈/프로필 공용)", name: "profile_photo", widget: "image", required: false }
          - { label: "전화번호", name: "phone", widget: "string" }
          - { label: "이메일", name: "email", widget: "string" }
          - label: "타이틀 뱃지 (예: 축제전문가, 문화기획가)"
            name: "titles"
            widget: "list"
            field: { label: "타이틀", name: "title", widget: "string" }

  - name: "profile"
    label: "상세 프로필"
    files:
      - name: "profile"
        label: "프로필 페이지 수정"
        file: "content/profile.json"
        fields:
          - { label: "소개글 (프로필 페이지 상단, 줄바꿈은 Enter 두 번)", name: "intro_long", widget: "text" }
          - label: "학력"
            name: "education"
            widget: "list"
            summary: "{{fields.school}}"
            fields:
              - { label: "기간 (선택)", name: "period", widget: "string", required: false }
              - { label: "학교/전공", name: "school", widget: "string" }
              - { label: "비고 (논문 제목 등, 선택)", name: "note", widget: "string", required: false }
          - label: "현직"
            name: "current_positions"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "축제 총감독 이력"
            name: "festival_director"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "행사 연출 이력"
            name: "event_direction"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "축제개발 컨설팅 · 연구"
            name: "consulting_research"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "축제 평가 위원 이력"
            name: "festival_evaluation"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "축제학교 / 인력양성"
            name: "school_activities"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "대학 · 대학원 강의"
            name: "lectures"
            widget: "list"
            field: { label: "내용", name: "title", widget: "string" }
          - label: "수상 내역"
            name: "awards"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "연도", name: "year", widget: "string" }
              - { label: "내용", name: "title", widget: "string" }

  - name: "projects"
    label: "프로젝트"
    files:
      - name: "projects"
        label: "프로젝트 목록 수정 (계속 추가 가능)"
        file: "content/projects.json"
        fields:
          - label: "프로젝트"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.period}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "고유 주소 (영문/숫자, 공백없이. 예: sejong-festival-2023)", name: "slug", widget: "string", hint: "프로젝트별 링크 주소로 쓰입니다. 다른 프로젝트와 겹치지 않게 만들어주세요." }
              - label: "카테고리"
                name: "category"
                widget: "select"
                options:
                  - { label: "축제총감독", value: "director" }
                  - { label: "행사연출", value: "direction" }
                  - { label: "컨설팅·연구", value: "consulting" }
                  - { label: "강의·교육", value: "lecture" }
              - { label: "기간 (예: 2022~2023)", name: "period", widget: "string", required: false }
              - { label: "주최/주관 기관 (선택)", name: "organizer", widget: "string", required: false }
              - { label: "대표 사진 (목록/카드에 표시)", name: "cover", widget: "image", required: false }
              - { label: "한 줄 요약", name: "summary", widget: "text", required: false }
              - { label: "상세 설명", name: "description", widget: "text", required: false }
              - label: "사진 갤러리 (여러 장 가능)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "사진", name: "photo", widget: "image" }
              - { label: "관련 보고서 파일 (PDF, 선택)", name: "report_file", widget: "file", required: false }
              - { label: "홈 화면 대표 프로젝트로 노출", name: "featured", widget: "boolean", default: false }
              - { label: "정렬 순서 (숫자가 클수록 위로, 선택)", name: "order", widget: "number", required: false, value_type: "int" }
