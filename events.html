<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand-link" href="index.html">
      <div class="brand-mark">윤</div>
      <div class="brand-lockup">
        <span class="brand-full" data-name>윤성진</span>
        <span class="brand-sub" data-logo-subtitle>축제총감독 · 문화기획가</span>
      </div>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_home">홈</a>
      <a href="profile.html" data-i18n="nav_profile">프로필</a>
      <a href="projects.html" data-i18n="nav_projects">프로젝트</a>
      <a href="events.html" data-i18n="nav_events" class="active">행사</a>
      <a href="calendar.html" data-i18n="nav_calendar" data-nav-calendar>캘린더</a>
      <a href="media.html" data-i18n="nav_media">미디어</a>
      <div class="lang-toggle">
        <button data-lang-btn="ko">KO</button>
        <button data-lang-btn="en">EN</button>
      </div>
    </nav>
    <button class="nav-toggle" aria-label="메뉴">☰</button>
  </div>
</header>

<section class="section" style="padding-top:60px;">
  <div class="wrap">
    <div class="section-head">
      <div class="section-eyebrow" data-i18n="events_eyebrow">NOW ON</div>
      <h2 class="section-title" data-events-title>진행중인 행사</h2>
      <p class="section-desc" data-i18n="events_page_desc">현재 진행 중이거나 곧 열리는 행사들을 소개합니다.</p>
    </div>
    <div class="filter-bar" data-status-tabs></div>
    <div class="filter-bar" data-category-tabs style="margin-top:-16px;"></div>
    <div class="project-grid" data-events-grid>
      <div class="empty-state" data-i18n="loading">불러오는 중…</div>
    </div>
  </div>
</section>

<footer class="site-footer-v2">
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <a class="brand-link" href="index.html">
        <div class="brand-mark">윤</div>
        <div class="brand-lockup">
          <span class="brand-full" data-name>윤성진</span>
          <span class="brand-sub" data-logo-subtitle>축제총감독 · 문화기획가</span>
        </div>
      </a>
      <p class="footer-desc" data-i18n="footer_desc">축제와 문화기획으로 도시의 이야기를 만듭니다.</p>
      <div class="social-bar footer-social" data-social-bar></div>

    <div class="footer-col">
      <h4 data-i18n="footer_menu">메뉴</h4>
      <a href="index.html" data-i18n="nav_home">홈</a>
      <a href="profile.html" data-i18n="nav_profile">프로필</a>
      <a href="projects.html" data-i18n="nav_projects">프로젝트</a>
      <a href="events.html" data-i18n="nav_events">행사</a>
      <a href="calendar.html" data-i18n="nav_calendar" data-nav-calendar>캘린더</a>
      <a href="media.html" data-i18n="nav_media">미디어</a>

      <a href="https://www.festivalsupport.net" target="_blank" rel="noopener">한국축제지원센터</a>
      <a href="https://www.gourmetnomad.kr/" target="_blank" rel="noopener">고메노마드</a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_contact">CONTACT</h4>
      <div class="footer-contact-line" data-phone>-</div>
      <div class="footer-contact-line" data-email>-</div>
      <a class="footer-contact-link" href="index.html#contact" data-i18n="footer_contact_cta">문의하기 →</a>

    <a href="/admin/" class="footer-admin-link" data-i18n="footer_admin">관리자</a>
